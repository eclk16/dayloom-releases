<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayloom Pro</title><link rel="icon" href="assets/icon.png">
<style>
:root{--bg:#f7f6f3;--card:#fff;--text:#17171a;--muted:#62626b;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e11;--card:#1b1b21;--text:#f3f3f6;--muted:#a3a3ad;--line:rgba(255,255,255,.09)}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 32px;max-width:440px}
.ico{font-size:56px}h1{font-size:26px;margin:10px 0 8px}p{color:var(--muted);margin:0}
</style></head><body><div class="card"><div class="ico" id="i">✅</div><h1 id="t"></h1><p id="m"></p></div>
<script>
var tr=(navigator.language||'').toLowerCase().indexOf('tr')===0, failed=/failed=1/.test(location.search);
document.getElementById('i').textContent=failed?'⚠️':'✅';
document.getElementById('t').textContent=failed?(tr?'Ödeme tamamlanamadı':'Payment didn’t go through'):(tr?'Teşekkürler!':'Thank you!');
document.getElementById('m').textContent=failed?(tr?'Kartından para çekilmedi. Dayloom’a dönüp tekrar deneyebilirsin.':'You weren’t charged. Go back to Dayloom and try again.'):(tr?'Ödemen alındı. Dayloom’a dön; Pro birkaç saniye içinde açılır.':'Your payment went through. Go back to Dayloom — Pro turns on in a few seconds.');
</script></body></html>
