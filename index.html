<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayloom — A calmer way to plan your workday</title>
<meta name="description" content="Dayloom is a day planner for Mac. Write down your tasks in the morning, and Dayloom schedules them across your work hours. It also tracks time, plans with AI and supports teams.">
<meta property="og:title" content="Dayloom">
<meta property="og:description" content="A calmer way to plan your workday on the Mac.">
<meta property="og:image" content="shots/en/home.png">
<link rel="icon" href="assets/icon.png">
<style>
:root {
  --bg: #f7f6f3; --bg2: #efede8; --card: #ffffff; --text: #17171a; --muted: #62626b; --line: rgba(0,0,0,.08);
  --accent: #e8505b; --accent2: #7c5cff; --accent3: #18a5d6; --green: #2fb36b;
  --shadow: 0 30px 80px -20px rgba(30,20,60,.35), 0 8px 24px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0e11; --bg2: #16161b; --card: #1b1b21; --text: #f3f3f6; --muted: #a3a3ad; --line: rgba(255,255,255,.09);
          --shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 8px 24px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html[dir="rtl"] body { font-family: -apple-system, "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", "Noto Nastaliq Urdu", sans-serif; }
a { color: inherit; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

header.top { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); }
.nav { display: flex; align-items: center; gap: 18px; height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; text-decoration: none; font-size: 19px; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.spacer { flex: 1; }
.nav a.link { text-decoration: none; color: var(--muted); font-size: 15px; }
.nav a.link:hover { color: var(--text); }
select.lang { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background-color: var(--card); color: var(--text);
  border-radius: 999px; padding: 6px 30px 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
html[dir="rtl"] select.lang { padding: 6px 14px 6px 30px; background-position: 16px 55%, 11px 55%; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 14px; font-weight: 650; text-decoration: none; font-size: 17px; transition: transform .15s, filter .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), #f0734d); box-shadow: 0 12px 30px -8px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.ghost { background: var(--card); border: 1px solid var(--line); }
.btn svg { width: 18px; height: 18px; }
.nav .btn { padding: 8px 16px; font-size: 14px; border-radius: 10px; }

.hero { position: relative; padding: 84px 0 40px; text-align: center; }
.glow { position: absolute; inset: -120px -20% auto; height: 760px; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 40% at 30% 30%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
              radial-gradient(40% 40% at 72% 25%, color-mix(in srgb, var(--accent2) 30%, transparent), transparent 70%),
              radial-gradient(35% 35% at 50% 70%, color-mix(in srgb, var(--accent3) 18%, transparent), transparent 70%);
  filter: blur(20px); }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.badge b { color: var(--accent2); }
.hero h1 { font-size: clamp(40px, 7vw, 76px); line-height: 1.04; margin: 22px auto 18px; letter-spacing: -.03em; max-width: 900px; font-weight: 800; }
.hero h1 .g { background: linear-gradient(90deg, var(--accent), var(--accent2) 60%, var(--accent3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: clamp(18px, 2.3vw, 21px); color: var(--muted); max-width: 720px; margin: 0 auto 32px; }
.cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.meta { margin-top: 16px; color: var(--muted); font-size: 14px; }

.stage { position: relative; margin: 64px auto 0; max-width: 1120px; }
.shot { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); background: var(--card); width: 100%; }
.stage .panel { position: absolute; width: 27%; right: -3%; bottom: -8%; border-radius: 16px; transform: rotate(2deg); }
html[dir="rtl"] .stage .panel { right: auto; left: -3%; transform: rotate(-2deg); }
.float { animation: float 7s ease-in-out infinite; }
@keyframes float { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }

section { padding: 96px 0; }
.kicker { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
h2 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; margin: 0 0 14px; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 18px; max-width: 640px; }
.center { text-align: center; } .center .sub { margin: 0 auto; }




.band { background: var(--bg2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pill.team { color: var(--accent3); background: color-mix(in srgb, var(--accent3) 14%, transparent); }
.pill.freepro { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 13%, transparent); }

/* Özellik vitrini */
.sc-intro { padding-bottom: 36px; }
.legend { list-style: none; padding: 0; margin: 26px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; color: var(--muted); font-size: 14.5px; }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.catnav { position: sticky; top: 62px; z-index: 15; backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0; justify-content: center; }
.chips::-webkit-scrollbar { display: none; }
.chips a { flex: none; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid transparent; transition: background .2s, color .2s; }
.chips a:hover { color: var(--text); background: var(--card); }
.chips a.on { color: var(--text); background: var(--card); border-color: var(--line); }
.cat { padding: 88px 0; scroll-margin-top: 112px; }
.cat-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "head stage" "list stage"; column-gap: 56px; row-gap: 22px; align-items: start; }
.cat-grid.flip { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: "stage head" "stage list"; }
.cat-head { grid-area: head; }
.cat-head h2 { margin-bottom: 10px; }
.sc-stage { grid-area: stage; position: sticky; top: 132px; }
.fl { grid-area: list; display: grid; gap: 8px; }
.zoom { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 11; padding: clamp(14px, 3vw, 34px); border: 1px solid var(--line); border-radius: 24px; cursor: zoom-in; font: inherit; color: inherit;
  background: radial-gradient(60% 70% at 15% 10%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
              radial-gradient(60% 70% at 90% 90%, color-mix(in srgb, var(--accent2) 13%, transparent), transparent 70%), var(--card); }
.zoom img { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 12px; border: 1px solid var(--line);
  box-shadow: 0 24px 60px -24px rgba(30,20,60,.38), 0 6px 18px rgba(0,0,0,.08); background: var(--card); transition: opacity .25s ease; }
.zoom img.fade { opacity: 0; }
.zoom:focus-visible, .fc:focus-visible, .chips a:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }
.fc { display: flex; gap: 14px; align-items: flex-start; text-align: start; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; }
button.fc { cursor: pointer; transition: background .2s, border-color .2s; }
button.fc:hover { background: color-mix(in srgb, var(--card) 70%, transparent); }
.fc.on { background: var(--card); border-color: var(--line); box-shadow: 0 10px 28px -18px rgba(0,0,0,.3); }
.fi { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 11%, transparent); }
.fc.on .fi { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.fc.plain .fi { color: var(--muted); background: color-mix(in srgb, var(--text) 6%, transparent); }
.ic { width: 20px; height: 20px; }
.fb { display: grid; gap: 3px; min-width: 0; }
.fh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.fh b { font-size: 16px; font-weight: 650; }
.fd { color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 40px; text-align: start; }
.pc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.pc h3 { margin: 14px 0 6px; font-size: 17px; }
.pc p { margin: 0; color: var(--muted); font-size: 15px; }
.feats-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: min(1400px, 94vw); max-height: 92vh; overflow: visible; }
dialog.lightbox::backdrop { background: rgba(10,10,14,.72); backdrop-filter: blur(4px); }
dialog.lightbox img { max-width: min(1400px, 94vw); max-height: 88vh; width: auto; height: auto; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); background: #fff; }
dialog.lightbox .x { position: absolute; top: -14px; inset-inline-end: -14px; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--card); color: var(--text); font-size: 20px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
@media (max-width: 980px) {
  .cat-grid, .cat-grid.flip { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "stage" "list"; }
  .sc-stage { position: static; }
  .pgrid { grid-template-columns: 1fr 1fr; }
  .chips { justify-content: flex-start; }
}
@media (max-width: 600px) {
  .cat { padding: 60px 0; }
  .pgrid { grid-template-columns: 1fr; }
  .zoom { aspect-ratio: auto; padding: 12px; border-radius: 18px; }
  .zoom img { max-height: 70vh; }
  .fc { padding: 12px; gap: 12px; }
  .catnav { top: 62px; }
}
@media (prefers-reduced-motion: reduce) { .zoom img { transition: none; } html { scroll-behavior: auto; } }

main { overflow-x: clip; }
.final { text-align: center; padding: 110px 0; position: relative; overflow: hidden; }
.final .icon { width: 108px; height: 108px; border-radius: 26px; margin: 0 auto 26px; box-shadow: var(--shadow); }
footer .legal { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-bottom: 12px; }
footer .legal a { color: var(--muted); text-decoration: none; } footer .legal a:hover { color: var(--text); text-decoration: underline; }
footer .seller, footer .cards { margin: 6px 0; font-size: 13px; }
footer { padding: 30px 16px 46px; color: var(--muted); font-size: 14px; text-align: center; }

.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.reveal.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .float { animation: none; } .btn:hover { transform: none; } }


.plans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin: 44px auto 0; text-align: start; align-items: stretch; }
.plan { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column; min-width: 0; }
.plan.pro { border: 2px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(135deg, var(--accent), var(--accent2)) border-box; position: relative; box-shadow: var(--shadow); }
.plan .tag { position: absolute; top: -13px; inset-inline-end: 24px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; letter-spacing: .03em; }
.plan h3 { margin: 0; font-size: 22px; }
.plan .desc { color: var(--muted); margin: 6px 0 20px; font-size: 15.5px; }
.price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.price b { font-size: 40px; letter-spacing: -.02em; }
.plan .seats { align-self: flex-start; margin: 0 0 22px; padding: 4px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 650; color: var(--accent2); background: color-mix(in srgb, var(--accent2) 12%, transparent); }
.price span { color: var(--muted); }
.plan ul { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 11px; flex: 1; align-content: start; }
.plan li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.plan li::before { content: "✓"; flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 2px;
  color: var(--green); background: color-mix(in srgb, var(--green) 16%, transparent); }
.plan.pro li::before { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 16%, transparent); }
.plan li.head { font-weight: 650; }
.plan li.head::before { content: "★"; }
.plan .btn { justify-content: center; text-align: center; padding: 13px 16px; font-size: 15.5px; }
.note { color: var(--muted); font-size: 14px; margin-top: 22px; }
@media (min-width: 1081px) { .plan .desc { min-height: 3.1em; } }
@media (max-width: 1080px) { .plans { grid-template-columns: 1fr 1fr; max-width: 820px; row-gap: 28px; } }
@media (max-width: 640px) { .plans { grid-template-columns: 1fr; max-width: 480px; } }

.pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; align-self: flex-start; }
.pill.free { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.pill.pro { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.pill.both { color: var(--accent2); background: color-mix(in srgb, var(--accent2) 13%, transparent); }
.feats-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
@media (max-width: 900px) {
  .nav a.link { display: none; }
  .stage .panel { width: 34%; right: -1%; }
}
@media (max-width: 600px) {
  section { padding: 68px 0; }
  .hero { padding-top: 56px; }
  .nav .btn { display: none; }
  .stage .panel { display: none; }
}
</style>
</head>

<script>
(function () {
  var I = window.DAYLOOM_I18N, sel = document.getElementById('lang'), html = document.documentElement;
  var shotDir = 'en';
  function shotSrc(name) { return 'shots/' + shotDir + '/' + name + '.png'; }
  var order = ["en","tr","de","fr","es","pt","id","zh-Hans","ja","ko","ar","ur","ru","hi","bn","vi"];
  order.forEach(function (c) { if (I[c]) { var o = document.createElement('option'); o.value = c; o.textContent = I[c]._name; sel.appendChild(o); } });
  function detect() {
    var saved = null; try { saved = localStorage.getItem('dayloom-lang'); } catch (e) {}
    if (saved && I[saved]) return saved;
    var prefs = navigator.languages || [navigator.language || 'en'];
    for (var i = 0; i < prefs.length; i++) {
      var p = (prefs[i] || '').toLowerCase();
      if (p.indexOf('zh') === 0) return 'zh-Hans';
      if (I[p.split('-')[0]]) return p.split('-')[0];
    }
    return 'en';
  }
  function apply(l) {
    var d = I[l], en = I.en;
    html.lang = l; html.dir = (l === 'ar' || l === 'ur') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i]').forEach(function (el) { var k = el.getAttribute('data-i'); el.textContent = d[k] || en[k] || ''; });
    shotDir = l === 'tr' ? 'tr' : 'en';
    document.querySelectorAll('img[data-shot]').forEach(function (el) { el.src = shotSrc(el.getAttribute('data-shot')); });
    document.querySelectorAll('[data-alt]').forEach(function (el) { el.alt = d[el.getAttribute('data-alt')] || en[el.getAttribute('data-alt')] || ''; });
    document.querySelectorAll('[data-aria]').forEach(function (el) { el.setAttribute('aria-label', d[el.getAttribute('data-aria')] || en[el.getAttribute('data-aria')] || ''); });
    document.title = 'Dayloom — ' + (d['hero.title1'] || en['hero.title1']) + ' ' + (d['hero.title2'] || en['hero.title2']);
    sel.value = l;
  }
  var S = window.DAYLOOM_SELLER || {};
  var sl = document.getElementById('seller');
  [S.name, S.address, S.email, S.phone].filter(Boolean).forEach(function (v, i) {
    if (i) sl.appendChild(document.createTextNode(' · '));
    if (v === S.email) { var a = document.createElement('a'); a.href = 'mailto:' + v; a.textContent = v; sl.appendChild(a); } else sl.appendChild(document.createTextNode(v));
  });
  sel.addEventListener('change', function () { try { localStorage.setItem('dayloom-lang', sel.value); } catch (e) {} apply(sel.value); });
  apply(detect());
  // Vitrin: bir özelliği seçince bölümün görüntüsü değişir
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.cat-grid').forEach(function (grid) {
    var img = grid.querySelector('.sc-stage img');
    grid.querySelectorAll('button.fc').forEach(function (b) {
      b.addEventListener('click', function () {
        grid.querySelectorAll('button.fc').forEach(function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
        var name = b.getAttribute('data-shot');
        var box = img.getBoundingClientRect();
        if (box.bottom < 80 || box.top > window.innerHeight) img.closest('.sc-stage').scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
        if (img.getAttribute('data-shot') === name) return;
        var swap = function () {
          img.setAttribute('data-shot', name);
          img.setAttribute('data-alt', 'alt.' + name);
          img.width = +b.getAttribute('data-w'); img.height = +b.getAttribute('data-h');
          var d = I[sel.value] || I.en; img.alt = d['alt.' + name] || I.en['alt.' + name] || '';
          img.src = shotSrc(name);
        };
        if (reduce) { swap(); return; }
        img.classList.add('fade');
        setTimeout(function () { swap(); var done = function () { img.classList.remove('fade'); }; if (img.complete) done(); else { img.onload = done; img.onerror = done; } }, 160);
      });
    });
  });
  // Büyütme
  var lb = document.getElementById('lightbox');
  document.querySelectorAll('.zoom').forEach(function (z) {
    z.addEventListener('click', function () {
      var src = z.querySelector('img');
      if (!lb || typeof lb.showModal !== 'function') { window.open(src.src, '_blank'); return; }
      var big = lb.querySelector('img'); big.src = src.src; big.alt = src.alt; lb.showModal();
    });
  });
  if (lb) {
    lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('x')) lb.close(); });
  }
  // Kategori çubuğu: görünen bölümü işaretle
  var chips = document.querySelectorAll('.chips a');
  if ('IntersectionObserver' in window && chips.length) {
    var current = null;
    var co = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var id = e.target.id.replace('cat-', '');
        if (id === current) return; current = id;
        chips.forEach(function (c) {
          var on = c.getAttribute('data-cat') === id; c.classList.toggle('on', on);
          if (on && c.parentNode.scrollWidth > c.parentNode.clientWidth) c.parentNode.scrollTo({ left: c.offsetLeft - 16, behavior: reduce ? 'auto' : 'smooth' });
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('section.cat').forEach(function (sec) { co.observe(sec); });
  }
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { threshold: .12 }) : null;
  document.querySelectorAll('.reveal').forEach(function (el) { io ? io.observe(el) : el.classList.add('on'); });
})();
</script>
